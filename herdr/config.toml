onboarding = false
[theme]
name = "kanagawa"

# Match tmux muscle memory — see ~/dotfiles/.tmux.conf
[keys]
prefix = "ctrl+q"   # tmux: set -g prefix C-q
detach = "prefix+d" # tmux default detach is prefix+d (herdr default was prefix+q)

# Splits — match tmux keys: " = top/bottom, % = left/right
split_horizontal = "prefix+\""  # tmux: bind " split-window (top/bottom)
split_vertical   = "prefix+%"   # tmux: bind % split-window -h (left/right)

# Move within the spaces sidebar (navigate mode)
navigate_workspace_down = "ctrl+n" # down = next in the list
navigate_workspace_up   = "ctrl+p" # up = previous in the list

# true だと隣接する2枚の枠線が並び、上下は左右の倍の実寸になる
[ui]
pane_gaps = false
# マウスを使わないので、スクロールバー用に常時確保される 1 列を本文に回す
pane_scrollbars = false

# plannotator/herdr-annotate（herdr plugin install plannotator/herdr-annotate）
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate selection"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as markdown"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations and archive"

[[keys.command]]
key = "prefix+ctrl+v"
type = "plugin_action"
command = "annotate.paste-archive"
description = "paste annotations into agent prompt"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "annotate.send-archive"
description = "send annotations to agent"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review agent's recent replies"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "annotate.last-newest"
description = "review agent's newest reply"
